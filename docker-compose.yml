x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - .:/var/www/html
  environment: &app-env
    # Les variables d'environnement réelles priment sur le fichier .env.
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-helixir}
    DB_USERNAME: ${DB_USERNAME:-helixir}
    DB_PASSWORD: ${DB_PASSWORD:-helixir}
    # File de jobs en base ; un job est rendu à la file s'il n'a pas répondu en 360 s
    # (doit rester supérieur au timeout du worker).
    QUEUE_CONNECTION: database
    DB_QUEUE_RETRY_AFTER: 360

services:
  app:
    <<: *app
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Lance un cycle de collecte toutes les 5 minutes (routes/console.php).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  # Collectent les jeux en parallèle : un job par jeu, QUEUE_WORKERS workers.
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=1", "--timeout=300"]
    deploy:
      replicas: ${QUEUE_WORKERS:-4}
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-helixir}
      POSTGRES_USER: ${DB_USERNAME:-helixir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helixir}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
